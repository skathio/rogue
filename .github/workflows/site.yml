# Deploys the project page in site/ and its docs to GitHub Pages (https://skathio.github.io/rogue/)
# through hashira's pages-site.yml, the shared Pages flow of the skathio project sites.
#
# One release, one approval. publish.yml builds the site before it tags (a `deploy: false` call of
# pages-site.yml) and calls this after `publish`, which already passed the `production`
# Environment's owner approval, so the page goes out after the package with no second approval
# (`released: true` skips pages-site's `gate`) and deploys that build (`prebuilt: true`). Run by
# hand, for a page-only fix, it builds and waits at that gate for the same approval. pages-site.yml
# itself refuses `released: true` unless the run already holds an approved `production` review,
# so a hand run that sets it is refused there. There is no push trigger: a deploy is always a
# release or an approved run, so the docs match the version on NuGet.
#
# pages-site.yml does the rest: it refuses any ref but main before the approval, copies site/ (the
# landing page), adds the site kit in `_kit/`, builds the docs from docs/ and .github/pages.json
# into `docs/`, uploads, and deploys; a released run deploys only while its commit holds the
# highest vX.Y.Z tag. The docs_pre_build_command below, tools/docs-api/pre-build.sh, writes the
# API reference and its grouped sidebar into the staged docs before VitePress runs. ci.yml and
# publish.yml pass the same command, so keep the three copies equal. A deploy that fails after the
# push (a network error in restore or docfx) is not retried here: re-run this workflow by hand,
# approved in `production`.
name: site

on:
  workflow_dispatch:
    inputs:
      # A boolean here too, so `inputs.released` is false, not null, on a hand run when it is
      # passed to pages-site.yml's boolean input. pages-site.yml refuses true on a hand run.
      released:
        description: "Leave unchecked. Only a release deploys without the approval; a hand run with this set is refused."
        type: boolean
        default: false
  workflow_call:
    inputs:
      released:
        description: "true only from a release job that already passed the production approval in the same run, after a deploy: false call of pages-site.yml uploaded the site (released deploys that build)."
        type: boolean
        default: false

permissions: {}

jobs:
  site:
    # pages-site.yml's build job reads the repo; its deploy job publishes to Pages and proves
    # itself with OIDC. A called workflow's jobs get no more than this.
    permissions:
      contents: read   # pages-site build: checkout
      pages: write     # pages-site deploy: deploy-pages
      id-token: write  # pages-site deploy: deploy-pages authenticates via OIDC
    uses: skathio/hashira/.github/workflows/pages-site.yml@v3 # moving major tag: new v3.x releases apply with no PR
    with:
      released: ${{ inputs.released }}
      # A released run deploys the site publish.yml's `site-check` job built in the same run
      # (pages-site.yml's default artifact name), so a release builds and scans it once, before
      # the tag. A hand run builds.
      prebuilt: ${{ inputs.released }}
      artifact_name: github-pages
      dotnet_version: '10.0.x'
      # Trusted input, written here and never from PR or event text.
      docs_pre_build_command: bash tools/docs-api/pre-build.sh
