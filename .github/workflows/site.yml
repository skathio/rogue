# Deploys the project page in site/ to GitHub Pages (https://skathio.github.io/<repo>/).
#
# One release, one approval. publish.yml calls this after `publish`, which already passed the
# `production` Environment's owner approval, so the page goes out after the package with no second
# approval (`released: true` skips `gate`). Run by hand, for a page-only fix, it waits at `gate` for
# that same approval. There is no push trigger: a deploy is always a release or an approved run.
# The build job runs docs-site/build.sh, which builds the VitePress docs (guides and the API
# reference generated from the /// comments) and assembles artifacts/pages: the site/ files at
# its root and the docs under docs/. That folder is uploaded with hashira's pages-upload and
# deployed with pages-deploy, at the same pin as the other skathio sites. The docs go out with
# each release, so they match the version on NuGet. Deploys only from main; the github-pages environment's branch policy enforces that too.
# publish.yml runs the same docs build in its `docs` job before the NuGet push, so a broken docs
# build stops the release. A deploy that still fails after the push (a network error in npm ci,
# restore or docfx) is not retried here: re-run this workflow by hand, approved in `production`.
name: site

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      released:
        description: "true only from publish.yml's `site` job, whose `publish` job already passed the production approval."
        type: boolean
        default: false

permissions: {}


jobs:
  # One release, one approval: this job waits for the `production` Environment's owner approval.
  gate:
    if: ${{ !inputs.released }}
    runs-on: ubuntu-latest
    environment: production
    permissions: {}
    steps:
      - name: Owner approval
        run: echo "Approved in the production environment."

  build:
    needs: gate
    # After the approval at `gate`, or from publish.yml with `gate` skipped.
    if: ${{ !cancelled() && (needs.gate.result == 'success' || (needs.gate.result == 'skipped' && inputs.released)) }}
    runs-on: ubuntu-latest
    # Read only: this job runs npm packages, VitePress and docfx. pages-upload does not need the
    # OIDC token or Pages write (upload-pages-artifact v3.0.1 is a tar plus actions/upload-artifact,
    # which uses the runner's own token); only `deploy` holds those grants.
    permissions:
      contents: read
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Install the docs toolchain from the lockfile
        working-directory: docs-site
        run: npm ci
      - name: Build the docs and assemble the Pages folder
        run: docs-site/build.sh
      - uses: skathio/hashira/.github/actions/pages-upload@2c8d52526cbce593a445f7572b599813503160f5 # v3.0.0
        with:
          path: artifacts/pages

  deploy:
    needs: build
    # One Pages deploy at a time. On this job only, so a run waiting at `gate` never holds the
    # queue for the others.
    concurrency:
      group: pages
      cancel-in-progress: false
    # `!cancelled()` because a skipped `gate` upstream would otherwise skip this job too; unlike
    # `always()` it still stops on a cancelled run.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write      # deploy-pages
      id-token: write   # deploy-pages authenticates via OIDC
    steps:
      - id: deploy
        uses: skathio/hashira/.github/actions/pages-deploy@2c8d52526cbce593a445f7572b599813503160f5 # v3.0.0
