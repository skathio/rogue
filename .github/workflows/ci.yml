# .github/workflows/ci.yml
#
# The `ci` job calls hashira's nuget-package-ci.yml at `v3`, hashira's moving
# major tag, the same ref as publish.yml: new v3.x releases apply with no PR
# here, and both files move to `v4` together when it ships. Its `passed` job
# reports as `ci / passed`, the one check the org's `ci-required` ruleset
# requires, so this job's id must stay `ci`. hashira checks its composite
# actions out at its own commit, so there is no `library_ref` to pass. It also
# runs SoMi's quality gate on each pull request's change (the `quality-gate`
# job), at its default level. Releases are cut by publish.yml, not by a
# dispatch of this workflow, because NuGet trusted publishing needs the push
# to run in a job of this repository (see publish.yml's header).
name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  # The `nuget-package-ci.yml` reusable workflow's test step runs
  # `dotnet test 'SkathIO.Rogue.sln' ...`, so this is the gate for the
  # multi-project smoke test too (.somi/plans/pd17-metadata-suppression/):
  # SkathIO.Rogue.Smoke.{Infrastructure,Application,Api,Tests} are ordinary
  # projects in this solution (see tests/SkathIO.Rogue.Smoke.Tests/README.md),
  # so they build and run on every PR here with no extra job needed. Chosen
  # over gating in `publish.yml` because it catches a multi-project wiring
  # regression on the PR that introduces it, not only at release time.
  ci:
    uses: skathio/hashira/.github/workflows/nuget-package-ci.yml@v3 # moving major tag: new v3.x releases apply with no PR
    # A reusable workflow can only narrow these. contents: read for every job; pull-requests: write
    # for the `passed` job, which keeps hashira's one CI summary comment on the pull request;
    # security-events: write for scan-suite's CodeQL upload.
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    with:
      project_path: 'SkathIO.Rogue.sln'
      dotnet_version: '10.0.x'

  aot-publish:
    name: AOT publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Install native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Publish AOT sample
        run: dotnet publish samples/SkathIO.Rogue.Aot.Sample/SkathIO.Rogue.Aot.Sample.csproj -c Release -r linux-x64
      - name: Run AOT binary
        run: ./samples/SkathIO.Rogue.Aot.Sample/bin/Release/net10.0/linux-x64/publish/SkathIO.Rogue.Aot.Sample
      - name: Publish jobs and messaging AOT sample
        run: dotnet publish samples/SkathIO.Rogue.Jobs.Messaging.Aot.Sample/SkathIO.Rogue.Jobs.Messaging.Aot.Sample.csproj -c Release -r linux-x64
      - name: Run jobs and messaging AOT binary
        run: ./samples/SkathIO.Rogue.Jobs.Messaging.Aot.Sample/bin/Release/net10.0/linux-x64/publish/SkathIO.Rogue.Jobs.Messaging.Aot.Sample

  # Packs the twelve packages into a local feed and runs the separate consumer solution
  # (tests/consumer), which restores them by package reference as an app would. The `ci` job tests
  # the projects through project references only, so packaging faults show up here alone.
  consumer:
    name: Consumer suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      # run.sh publishes the two AOT samples natively from the packed packages (tests/consumer/aot.sh).
      - name: Install native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Pack the packages and run the consumer solution against them
        run: tests/consumer/run.sh

  # The full docs build, the one site.yml deploys through hashira's pages-site.yml: the API
  # reference generated from the /// comments by docfx, its cleanup by tools/docs-api/clean-api.mjs,
  # and hashira's docs-build (pages.json checks and VitePress, whose dead-link check stays on). A
  # dead link or a build error fails the pull request.
  docs:
    name: Docs build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - uses: skathio/hashira/.github/actions/docs-build@v3 # moving major tag: new v3.x releases apply with no PR
        with:
          # Trusted input: the same command as site.yml's docs_pre_build_command; keep them equal.
          pre_build_command: |
            dotnet tool restore
            dotnet restore SkathIO.Rogue.sln
            docfx_out="$(mktemp -d)"
            dotnet docfx metadata tools/docs-api/docfx.json --output "$docfx_out"
            node tools/docs-api/clean-api.mjs "$docfx_out/docfx" "$DOCS_STAGE/api"
            rm -rf "$docfx_out"
      - name: Run the docs tooling tests
        run: node --test tools/docs-api/

  bench-smoke:
    name: Benchmark smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Benchmark smoke run
        run: dotnet run --project bench/SkathIO.Rogue.Benchmarks/SkathIO.Rogue.Benchmarks.csproj -c Release -- --filter '*NoBehavior*' --job short --exporters json
      - name: Check allocation threshold
        run: |
          # The committed threshold is the concrete-path contract (RogueDispatcher.Send_PingRequest
          # is 0-alloc, authoritatively gated at the PipelineExecutor.Execute layer by
          # PipelineExecutorTests.Execute_NoBehaviors_ZeroAllocations in the `ci` job). It must stay 0
          # (NFR-PERF-1 / AC-6.2).
          threshold=$(jq '.scenario1_rogue_allocated_bytes // 0' .bench/thresholds.json)
          echo "NFR-PERF-1 committed contract: scenario1_rogue_allocated_bytes=${threshold}"
          if [ "$threshold" != "0" ]; then
            echo "FAIL: committed contract is non-zero — the concrete 0-alloc path is the v1 promise (NFR-PERF-1)" && exit 1
          fi
          # Dynamic regression tripwire (7.2.1 pass-1 review, option (a)): gate the *measured*
          # ISender.Send<T> interface-path allocation from the just-run BDN artifact against the
          # committed interface_path_ceiling_bytes ceiling. This path boxes one ValueTask<T> by design
          # (PD-12) and is NOT expected to be 0 — it is the public convenience path, not the concrete
          # 0-alloc path (which is private on the internal generated dispatcher and unreachable from
          # the bench consumer assembly). The ceiling makes bench-smoke a real tripwire: a large
          # allocation regression on the interface path fails the build. Update
          # interface_path_ceiling_bytes in .bench/thresholds.json if the baseline changes legitimately.
          ceiling=$(jq '.interface_path_ceiling_bytes // 1024' .bench/thresholds.json)
          result_file=$(find BenchmarkDotNet.Artifacts/results -name '*NoBehaviorBenchmarks-report-full-compressed.json' | head -1)
          if [ -z "$result_file" ]; then
            echo "FAIL: no BDN JSON artifact found — bench-smoke runs the benchmark to read it; a missing artifact is a broken run, not a pass" && exit 1
          fi
          measured=$(jq '[.Benchmarks[] | select(.Method=="Rogue_NoBehavior") | .Memory.BytesAllocatedPerOperation] | first // empty' "$result_file")
          if [ -z "$measured" ] || [ "$measured" = "null" ]; then
            echo "FAIL: no Rogue_NoBehavior benchmark in artifact — the dynamic interface-path tripwire cannot run; treat as a broken run" && exit 1
          fi
          echo "Measured ISender.Send<T> interface-path allocation (PD-12 box): ${measured} B"
          echo "Committed interface-path ceiling: ${ceiling} B"
          # Numeric compare via jq (no bc dependency): fail if measured EXCEEDS the ceiling.
          over=$(jq -n --argjson m "$measured" --argjson c "$ceiling" '$m > $c')
          if [ "$over" = "true" ]; then
            echo "FAIL: Rogue interface-path allocates ${measured} B, ceiling is ${ceiling} B" && exit 1
          fi
          echo "OK: Rogue interface-path allocation ${measured} B is within ceiling ${ceiling} B"

  jobs-bench-smoke:
    name: Jobs benchmark smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Jobs benchmark smoke run (Rogue against Hangfire.InMemory)
        run: dotnet run --project bench/SkathIO.Rogue.Benchmarks.Jobs/SkathIO.Rogue.Benchmarks.Jobs.csproj -c Release -- --filter '*InMemoryJobsBenchmarks*' --job short --exporters json
      - name: Check Rogue's allocation per job
        run: |
          # Gates the allocation of every Rogue benchmark, divided by its job count, against the
          # committed ceiling. Allocation is gated, not time: it is stable on shared CI runners.
          # The ceiling must be a number: jq orders every number before every string, so no
          # measurement would be over a ceiling written as text, and the gate would pass anything.
          ceiling=$(jq -e '.jobs_rogue_bytes_per_job_ceiling | numbers' .bench/thresholds.json) || {
            echo "FAIL: jobs_rogue_bytes_per_job_ceiling in .bench/thresholds.json is missing or is not a number" && exit 1
          }
          result_file=$(find BenchmarkDotNet.Artifacts/results -name '*InMemoryJobsBenchmarks-report-full-compressed.json' | head -1)
          if [ -z "$result_file" ]; then
            echo "FAIL: no BDN JSON artifact for InMemoryJobsBenchmarks; a missing artifact is a broken run, not a pass" && exit 1
          fi
          rows=$(jq '[.Benchmarks[] | {name: (.Method + " " + .Parameters), rogue: (.Method | startswith("Rogue_")), bytes: .Memory.BytesAllocatedPerOperation, jobs: (.Parameters | capture("Jobs=(?<n>[0-9]+)").n | tonumber)}]' "$result_file")
          echo "$rows" | jq -r '.[] | "\(.name): \(if .bytes == null then "no result" else "\(.bytes / .jobs | floor) B per job" end)"'
          missing=$(echo "$rows" | jq '[.[] | select(.bytes == null)] | length')
          rogue=$(echo "$rows" | jq '[.[] | select(.rogue)] | length')
          if [ "$missing" != "0" ] || [ "$rogue" = "0" ]; then
            echo "FAIL: a benchmark has no result, or no Rogue benchmark ran; treat as a broken run" && exit 1
          fi
          over=$(echo "$rows" | jq --argjson c "$ceiling" '[.[] | select(.rogue and (.bytes / .jobs) > $c) | .name]')
          if [ "$over" != "[]" ]; then
            echo "FAIL: over the ceiling of ${ceiling} B per job: ${over}" && exit 1
          fi
          echo "OK: every Rogue benchmark is within ${ceiling} B per job"

  validation-bench-smoke:
    name: Validation benchmark smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Validation benchmark smoke run (Rogue against FluentValidation and MediatR)
        run: dotnet run --project bench/SkathIO.Rogue.Benchmarks.Validation/SkathIO.Rogue.Benchmarks.Validation.csproj -c Release -- --filter '*ValidationBenchmarks*' --job short --exporters json
      - name: Check Rogue's allocation per validation
        run: |
          # Gates each Rogue benchmark named in validation_rogue_bytes_ceiling against its own ceiling.
          # Every named benchmark must be in the results: one that did not run is a broken run.
          ceilings=$(jq -e '.validation_rogue_bytes_ceiling | objects | select(length > 0 and all(.[]; type == "number"))' .bench/thresholds.json) || {
            echo "FAIL: validation_rogue_bytes_ceiling in .bench/thresholds.json must map benchmark names to numbers" && exit 1
          }
          mapfile -t result_files < <(find BenchmarkDotNet.Artifacts/results -name '*ValidationBenchmarks-report-full-compressed.json' 2>/dev/null)
          if [ "${#result_files[@]}" = "0" ]; then
            echo "FAIL: no BDN JSON artifact for the validation benchmarks; a missing artifact is a broken run, not a pass" && exit 1
          fi
          rows=$(jq -s '[.[].Benchmarks[]? | {method: .Method, bytes: .Memory.BytesAllocatedPerOperation}]' "${result_files[@]}")
          echo "$rows" | jq -r '.[] | "\(.method): \(if .bytes == null then "no result" else "\(.bytes) B" end)"'
          failures=$(jq -n --argjson rows "$rows" --argjson c "$ceilings" '[$c | to_entries[] | . as $e
            | ([$rows[] | select(.method == $e.key)] | first) as $r
            | if $r == null or $r.bytes == null then "\($e.key): no result"
              elif $r.bytes > $e.value then "\($e.key): \($r.bytes) B, ceiling \($e.value) B"
              else empty end]')
          if [ "$failures" != "[]" ]; then
            echo "FAIL: ${failures}" && exit 1
          fi
          echo "OK: every gated Rogue validation benchmark is within its ceiling"

  license-check:
    name: License check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore SkathIO.Rogue.sln
      - name: Check BinaryFormatter (NFR-SEC-3)
        run: |
          if grep -rn "BinaryFormatter\|NetDataContractSerializer" src/; then
            echo "NFR-SEC-3 violation" && exit 1
          fi
          echo "NFR-SEC-3 OK"
      - name: Check competition package leak
        run: |
          if grep -rn 'PackageReference Include="MediatR"' src/; then
            echo "Competition package MediatR found in src/" && exit 1
          fi
          if grep -rn 'PackageReference Include="Mediator' src/; then
            echo "Competition package Mediator/Mediator.Abstractions/Mediator.SourceGenerator found in src/" && exit 1
          fi
          echo "Competition package check OK"
      - name: Check transitive dependency allow-list (AC-H / NFR-LIC-1)
        run: |
          # Enumerate the union of all top-level + transitive package ids (all
          # target frameworks) across the packable projects, and fail the
          # build if any id is not on the committed allow-list
          # (.github/allowed-packages.txt). The allow-list gates on package
          # identity: adding a new id requires a human to first verify the
          # package's license is permissive (see docs/governance.md).
          packable_projects=(
            "src/SkathIO.Rogue.Abstractions/SkathIO.Rogue.Abstractions.csproj"
            "src/SkathIO.Rogue/SkathIO.Rogue.csproj"
            "src/SkathIO.Rogue.MediatR/SkathIO.Rogue.MediatR.csproj"
            "src/SkathIO.Rogue.Logging/SkathIO.Rogue.Logging.csproj"
            "src/SkathIO.Rogue.Validation.FluentValidation/SkathIO.Rogue.Validation.FluentValidation.csproj"
            "src/SkathIO.Rogue.Validation/SkathIO.Rogue.Validation.csproj"
            "src/SkathIO.Rogue.Jobs/SkathIO.Rogue.Jobs.csproj"
            "src/SkathIO.Rogue.Jobs.Postgres/SkathIO.Rogue.Jobs.Postgres.csproj"
            "src/SkathIO.Rogue.Jobs.SqlServer/SkathIO.Rogue.Jobs.SqlServer.csproj"
            "src/SkathIO.Rogue.Messaging/SkathIO.Rogue.Messaging.csproj"
            "src/SkathIO.Rogue.Messaging.RabbitMQ/SkathIO.Rogue.Messaging.RabbitMQ.csproj"
            "src/SkathIO.Rogue.Messaging.Outbox/SkathIO.Rogue.Messaging.Outbox.csproj"
          )

          : > closure-ids.txt
          for project in "${packable_projects[@]}"; do
            dotnet list "$project" package --include-transitive --format json \
              | jq -r '.projects[].frameworks[] | (.topLevelPackages[]?.id, .transitivePackages[]?.id)' \
              >> closure-ids.txt
          done
          sort -u closure-ids.txt -o closure-ids.txt

          grep -v '^\s*#' .github/allowed-packages.txt | grep -v '^\s*$' | sort -u > allowed-ids.txt

          violations=$(comm -23 closure-ids.txt allowed-ids.txt)
          if [ -n "$violations" ]; then
            echo "FAIL: the following transitive dependency ids are not on .github/allowed-packages.txt:"
            echo "$violations"
            echo "Add each id to .github/allowed-packages.txt after verifying its license is permissive (see docs/governance.md)."
            exit 1
          fi
          echo "OK: all $(wc -l < closure-ids.txt) transitive dependency ids are on the allow-list"

  public-api:
    name: Public API
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Build (enforces PublicApiAnalyzers)
        run: dotnet build SkathIO.Rogue.sln -c Release

  # The runtime packages ship net8.0 and net10.0 builds, and the `ci` job tests only net10.0. This
  # job installs the .NET 8 runtime next to the .NET 10 SDK and runs the runtime packages' tests
  # under net8.0. RogueTestNet8=true makes those test projects build for net8.0 as well; without it
  # they build net10.0 alone, so the jobs that install only .NET 10 are unchanged.
  net8-tests:
    name: .NET 8 tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Test the runtime packages under net8.0
        run: |
          # Some tests read every project's restore graph, so restore the whole solution first.
          dotnet restore SkathIO.Rogue.sln -p:RogueTestNet8=true
          dotnet test tests/SkathIO.Rogue.UnitTests/SkathIO.Rogue.UnitTests.csproj -c Release -f net8.0 -p:RogueTestNet8=true
          dotnet test tests/SkathIO.Rogue.Integration.Tests/SkathIO.Rogue.Integration.Tests.csproj -c Release -f net8.0 -p:RogueTestNet8=true
          dotnet test tests/SkathIO.Rogue.Behaviors.Tests/SkathIO.Rogue.Behaviors.Tests.csproj -c Release -f net8.0 -p:RogueTestNet8=true
          dotnet test tests/SkathIO.Rogue.DiResolution.Tests/SkathIO.Rogue.DiResolution.Tests.csproj -c Release -f net8.0 -p:RogueTestNet8=true
          dotnet test tests/SkathIO.Rogue.MediatR.Tests/SkathIO.Rogue.MediatR.Tests.csproj -c Release -f net8.0 -p:RogueTestNet8=true
          dotnet test tests/SkathIO.Rogue.Jobs.Tests/SkathIO.Rogue.Jobs.Tests.csproj -c Release -f net8.0 -p:RogueTestNet8=true
          dotnet test tests/SkathIO.Rogue.Jobs.Postgres.Tests/SkathIO.Rogue.Jobs.Postgres.Tests.csproj -c Release -f net8.0 -p:RogueTestNet8=true
          dotnet test tests/SkathIO.Rogue.Jobs.SqlServer.Tests/SkathIO.Rogue.Jobs.SqlServer.Tests.csproj -c Release -f net8.0 -p:RogueTestNet8=true
          dotnet test tests/SkathIO.Rogue.Messaging.Tests/SkathIO.Rogue.Messaging.Tests.csproj -c Release -f net8.0 -p:RogueTestNet8=true
          dotnet test tests/SkathIO.Rogue.Messaging.RabbitMQ.Tests/SkathIO.Rogue.Messaging.RabbitMQ.Tests.csproj -c Release -f net8.0 -p:RogueTestNet8=true
          dotnet test tests/SkathIO.Rogue.Messaging.Outbox.Tests/SkathIO.Rogue.Messaging.Outbox.Tests.csproj -c Release -f net8.0 -p:RogueTestNet8=true
