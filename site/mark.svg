<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512" role="img" aria-label="Rogue">
  <title>Rogue</title>
  <!-- A dagger glowing violet in a dark disc: a fullered blade, curved quillons with a gem,
       a wrapped grip and a jewelled pommel. Same disc, ring and glow as the other skathio marks. -->
  <defs>
    <radialGradient id="g" cx="50%" cy="45%" r="55%"><stop offset="0" stop-color="#24154a"/><stop offset=".6" stop-color="#140f24"/><stop offset="1" stop-color="#0b0c0f"/></radialGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5f3ff"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6"/><stop offset=".5" stop-color="#c4b5fd"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#g)"/>
  <circle cx="32" cy="32" r="27" fill="none" stroke="#6d28d9" stroke-width="2"/>
  <circle cx="32" cy="32" r="24.6" fill="none" stroke="#6d28d9" stroke-width=".5" stroke-opacity=".55" stroke-dasharray="1 2.2"/>
  <g transform="rotate(45 32 32)" filter="url(#glow)">
    <path d="M32 7.5L36.3 14.6L35.7 37H28.3L27.7 14.6Z" fill="url(#blade)"/>
    <path d="M32 7.5L27.7 14.6L28.3 37H32Z" fill="#ffffff" fill-opacity=".22"/>
    <path d="M32 13V35" stroke="#7c3aed" stroke-width=".9" stroke-linecap="round" stroke-opacity=".75"/>
    <path d="M20.5 36.6Q23.5 35.4 27 36.6H37Q40.5 35.4 43.5 36.6Q44.2 39.4 41.2 40.4H22.8Q19.8 39.4 20.5 36.6Z" fill="url(#gold)"/>
    <circle cx="32" cy="38.4" r="1.4" fill="#f5d0fe"/>
    <rect x="29.9" y="40.4" width="4.2" height="8.6" rx="1" fill="#6d28d9"/>
    <path d="M29.9 42.4L34.1 41.4M29.9 44.6L34.1 43.6M29.9 46.8L34.1 45.8" stroke="#c4b5fd" stroke-width=".8" stroke-linecap="round"/>
    <circle cx="32" cy="51.6" r="3" fill="#a78bfa"/>
    <circle cx="32" cy="51.6" r="1.3" fill="#f5f3ff"/>
  </g>
</svg>
